<!DOCTYPE html>
<html manifest="css.manifest">
<head>
<title>PS4 7.00 - 13.52 FW GoldHEN Host by MOHAMMED AI STORE</title>
<link rel="stylesheet" href="../style.css">
<style>
html{background-color:#000;background-image:none;height:100%;}
body{margin:0;}
.adfit{position:fixed;top:0;left:0;right:0;bottom:118px;background-image:url('../store_ad.jpg');background-position:center;background-size:contain;background-repeat:no-repeat;}
.statusbar{position:fixed;left:0;right:0;bottom:0;height:118px;background:#000;border-top:3px solid #d4af37;text-align:center;}
.statusbar h1{text-shadow:none;}
#msgs{font-size:30px;color:#fff;margin:14px 0 8px 0;}
.storeline{font-size:23px;color:#d4af37;margin:0;}
</style>
</head>
<body>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));window.msgs.innerHTML="Installing Offline Cache: " + Percent + "%";}
function DisplayCacheProgress(){window.msgs.innerHTML="Cache Installed Successfully ✔";setTimeout(function(){window.msgs.innerHTML="Now Close And Re-Open Your Browser ...";},1500);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML="Error Installing Cache! - Clear and Re-Open Your Browser ...";};
</script>
<div class="adfit"></div>
<div class="statusbar">
<h1 id=msgs>Starting Cache Installation...</h1>
<h1 class="storeline">MOHAMMED AI STORE — متجر محمد AI الإلكتروني — 07707089760</h1>
</div>
</body>
