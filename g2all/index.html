<!DOCTYPE html>
<html>
<head>
<title>PS4 7.00 - 13.52 FW GoldHEN Host by MOHAMMED AI STORE</title>
<link rel="stylesheet" href="../style.css">
<style>
html{background-color:#000;background-image:none;height:100%;}
body{margin:0;}
.adfit{position:fixed;top:0;left:0;right:0;bottom:118px;background-image:url('../store_ad.jpg');background-position:center;background-size:contain;background-repeat:no-repeat;}
.statusbar{position:fixed;left:0;right:0;bottom:0;height:118px;background:#000;border-top:3px solid #d4af37;text-align:center;}
.statusbar h1{text-shadow:none;}
#msgs{font-size:30px;color:#fff;margin:14px 0 8px 0;}
.storeline{font-size:23px;color:#d4af37;margin:0;}
</style>
</head>
<body>
<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

// FW 14.00 is served by the dedicated afterglow section (separate folder and
// cache). This branch only fires for a firmware g2all never supported --
// every 7.00-13.52 path below is unchanged.
if (isPS4 && fwNum > 13.52 && fwNum <= 14.00) {
    window.location.replace("../fw1400/index.html" + location.search);
}

function onScriptError() {
    msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "Only for PS4 with Firmware 5.05 and 7.00 to 13.52";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 13.52) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 13.02 && fwNum <= 13.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js?v=19";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>

<script>
/* Patch blobs (.elf/.bin) ship as base64 text (.b64); decode transparently. */
(function () {
  if (!window.fetch) return;
  var realFetch = window.fetch.bind(window);
  function b64ToU8(t) {
    t = String(t).replace(/\s+/g, "");
    var bin = atob(t);
    var u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return u8;
  }
  window.fetch = function (url, opts) {
    var u = String((url && url.url) || url || "");
    if (/(\.elf|\/patches\/[^\/]*\.bin)$/.test(u)) {
      return realFetch(u + ".b64", opts).then(function (r) {
        if (!r.ok) throw new Error("patch fetch failed: " + u);
        return r.text();
      }).then(function (t) {
        var u8 = b64ToU8(t);
        return { ok: true, status: 200,
          arrayBuffer: function () { return Promise.resolve(u8.buffer); } };
      });
    }
    return realFetch(url, opts);
  };
})();
</script>
<div class="adfit"></div>
<div class="statusbar">
<h1 id=msgs>Loading GoldHEN v2.4b18.12... Please Wait</h1>
<h1 class="storeline">MOHAMMED AI STORE — متجر محمد AI الإلكتروني — 07707089760</h1>
</div>
</body>
