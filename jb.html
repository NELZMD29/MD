<!doctype html>
<html lang="en" manifest="cache-1300.manifest">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" /><link rel="preload" as="image" href="store_ad.jpg">
    <title>MOHAMMED AI STORE</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100%;
        overflow: hidden;
        background: #05070a;
        color: #fff;
        font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
      }

      #storeAd {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1;
        overflow: hidden;
        background: #05070a;
      }

      #storeAd img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        object-position: center;
      }

      #storeAd::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0,0,0,.04), rgba(0,0,0,.20));
        pointer-events: none;
      }

      #spin {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid rgba(255,255,255,.25);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        z-index: 5;
        filter: drop-shadow(0 0 8px rgba(0,0,0,.9));
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      #msg {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(86vw, 720px);
        box-sizing: border-box;
        padding: 12px 18px;
        text-align: center;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: .2px;
        color: #fff;
        background: rgba(0,0,0,.55);
        border: 1px solid rgba(255,255,255,.35);
        border-radius: 8px;
        display: none;
        z-index: 6;
        text-shadow: 0 2px 6px #000;
      }

      #wrap { position: fixed; inset: 0; z-index: 4; padding: 0; pointer-events: none; }
      #state, #out { display: none; }

      body.done #spin { display: none; }
      body.fail #spin { display: none; }
      body.fail #msg { display: block; }

      body.log #spin, body.log #msg { display: none; }
      body.log #wrap {
        pointer-events: auto;
        padding: 14px 18px;
        box-sizing: border-box;
        background: linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,.34));
      }
      body.log #state {
        display: block;
        color: #fff;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 12px/1.45 Consolas, monospace;
        color: #fff;
        background: rgba(0,0,0,.68);
        border: 1px solid rgba(255,255,255,.25);
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 80px);
        overflow-y: auto;
      }
      .ok { color: #a8ffd0; } .bad { color: #ffd0d0; } .warn { color: #ffe39a; }
      .safe { color: #a8ffd0; } .danger { color: #ffd0d0; }
      code { color: #d6e7ff; }

</style>
  </head>
  <body>
    <div id="brand"><b>MOHAMMED AI STORE</b></div>
    <div id="storeAd" aria-label="Store advertisement"><img src="store_ad.jpg" alt="MOHAMMED AI Store advertisement" onerror="this.style.display='none'"></div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script>
      // Cache gate: the 13.x exploit only runs once its files are cached
      // (or when offline / cache already ready). After a fresh install the
      // user is told to turn off the internet and re-open the browser.
      (function () {
        var stateEl = document.getElementById("state");
        var spin = document.getElementById("spin");
        function run() {
          document.body.className = "";
          spin.style.display = "";
          var s = document.createElement("script");
          s.type = "module";
          s.src = "./jb.js?v=10";
          s.onerror = function () { document.body.className = "fail"; };
          document.head.appendChild(s);
        }
        function cacheDone() {
          document.body.className = "log";
          spin.style.display = "none";
          stateEl.innerHTML = "Cache Installed Successfully &#10004;<br>" +
            "Now turn OFF the internet, then CLOSE and RE-OPEN the browser";
        }
        var ac = window.applicationCache;
        document.body.className = "log";
        if (!ac || !document.documentElement.hasAttribute("manifest")) { run(); return; }
        if (!navigator.onLine) { stateEl.textContent = "offline \u2014 running from cache"; run(); return; }
        if (ac.status === ac.IDLE) { stateEl.textContent = "cached \u2014 offline ready"; run(); return; }
        if (ac.status === ac.UPDATEREADY) { try { ac.swapCache(); } catch (e) {} location.reload(); return; }
        spin.style.display = "none";
        stateEl.textContent = "installing offline cache...";
        ac.addEventListener("progress", function (e) {
          if (e && e.total) stateEl.textContent = "installing offline cache: " + Math.round(e.loaded / e.total * 100) + "%";
        }, false);
        ac.addEventListener("cached", cacheDone, false);
        ac.addEventListener("updateready", function () { try { ac.swapCache(); } catch (e) {} cacheDone(); }, false);
        ac.addEventListener("noupdate", function () { stateEl.textContent = "cached \u2014 offline ready"; run(); }, false);
        ac.addEventListener("error", function () { stateEl.textContent = "cache failed \u2014 running anyway"; run(); }, false);
        ac.addEventListener("obsolete", function () { stateEl.textContent = "cache obsolete \u2014 running anyway"; run(); }, false);
      })();
    </script>
  </body>
</html>
